# Deterministic acceptance seed for tester-env (local test env only).
# Applied via `offen setup -source /seed/seed.bootstrap.yml -force`.
# Theme: a small web studio runs Offen analytics for a client webshop
# ("Acme Store") plus its own site ("Studio Blog").
#
# - admin@offen.local: superadmin on both accounts (primary login).
# - editor@offen.local: non-admin member of Acme Store only (team/permissions).
# - Account IDs are fixed UUIDs so API/UI assertions are stable.
# - No analytics events: event payloads are end-to-end encrypted per-user
#   secrets and the `offen demo` seeder is wall-clock random; dashboards
#   deterministically show the empty state until scenario demand requires more.

account_users:
  - email: admin@offen.local
    password: offen-admin-123
    admin_level: 1
    accounts:
      - 11111111-1111-4111-8111-111111111111
      - 22222222-2222-4222-8222-222222222222
  - email: editor@offen.local
    password: offen-editor-123
    admin_level: 0
    accounts:
      - 11111111-1111-4111-8111-111111111111

accounts:
  - name: Acme Store
    id: 11111111-1111-4111-8111-111111111111
  - name: Studio Blog
    id: 22222222-2222-4222-8222-222222222222
